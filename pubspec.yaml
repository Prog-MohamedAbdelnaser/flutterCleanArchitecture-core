name: softcore
description: >-
  A thin state layer on top of flutter_bloc: typed states, a BaseCubit for
  loading and actions, and widgets that handle loading, error and data.
version: 1.0.1
homepage: https://github.com/Prog-MohamedAbdelnaser/flutterCleanArchitecture-core
repository: https://github.com/Prog-MohamedAbdelnaser/flutterCleanArchitecture-core
issue_tracker: https://github.com/Prog-MohamedAbdelnaser/flutterCleanArchitecture-core/issues
topics:
  - state-management
  - bloc
  - cubit
  - clean-architecture

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.1.0 <10.0.0"
  meta: ^1.11.0

dev_dependencies:
  bloc_test: ">=9.1.0 <11.0.0"
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
